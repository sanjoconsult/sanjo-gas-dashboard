name: LNG ship positions

# Every 30 minutes: listen to aisstream.io for 7 minutes, then publish ships.json
# to the ais-data branch (a single commit, replaced each run, so main stays clean
# and Netlify does not redeploy). The dashboard reads it from raw.githubusercontent.com.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ais
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'sanjoconsult/sanjo-gas-dashboard'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch the previous snapshot
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/ais-data/ships.json" -o prev.json || echo '{}' > prev.json
      - name: Listen to aisstream.io
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: node scripts/ais/collect.mjs prev.json ships.json
      - name: Publish to the ais-data branch
        run: |
          mkdir out && cp ships.json out/ && cd out
          git init -q -b ais-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ships.json
          git commit -q -m "LNG ship positions $(date -u +%FT%RZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ais-data
